<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Diagnóstico de Execuções — IPTV Access Portal</title>
    <style>
        :root {
            color-scheme: dark;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            --bg-base: #090a0f;
            --bg-card: #111217;
            --bg-subtle: #0d0e13;
            --border-card: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.05);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --text-dim: #71717a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 32px 20px;
            font-family: var(--font-sans);
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        main {
            max-width: 1140px;
            margin: 0 auto;
        }

        header, .toolbar, .run-top {
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 6px;
            transition: color 0.15s ease;
        }
        .back-link:hover {
            color: #ffffff;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 4px 0 6px;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 16px;
            color: #f4f4f5;
            letter-spacing: -0.01em;
        }

        h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 20px 0 12px;
            color: #e4e4e7;
        }

        p {
            line-height: 1.6;
            margin: 6px 0;
        }

        a {
            color: #cbd5e1;
            text-underline-offset: 3px;
            transition: color 0.15s ease;
        }
        a:hover {
            color: #ffffff;
        }

        .muted, small {
            color: var(--text-muted);
        }

        .card {
            padding: 24px;
            border: 1px solid var(--border-card);
            border-radius: 16px;
            background: var(--bg-card);
            box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        button, .button {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: #d4d4d8;
            padding: 10px 15px;
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button:hover, .button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }
        button:active, .button:active {
            transform: scale(0.98);
        }

        .primary {
            background: #f4f4f5;
            color: #090a0f;
            border: 1px solid #ffffff;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        .primary:hover {
            background: #ffffff;
            color: #090a0f;
            border-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
            transform: none;
        }

        :focus-visible {
            outline: 2px solid #a1a1aa !important;
            outline-offset: 2px !important;
        }

        .toolbar {
            margin-bottom: 20px;
            padding: 0 2px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        #runs {
            display: grid;
            gap: 10px;
        }

        .run {
            width: 100%;
            text-align: left;
            padding: 14px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .run:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: #15161f;
        }
        .run[aria-pressed="true"] {
            border-color: #52525b;
            background: #181924;
            box-shadow: inset 3px 0 0 #f4f4f5;
        }
        .run small {
            display: block;
            margin-top: 6px;
            line-height: 1.45;
            overflow-wrap: anywhere;
            font-size: 11px;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            padding: 3px 8px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            background: #27272a;
            color: #d4d4d8;
        }
        .badge.error, .badge.interrupted {
            color: #fb7185;
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.25);
        }
        .badge.completed {
            color: #34d399;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }
        .badge.running {
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        #notice {
            padding: 14px 18px;
            margin-bottom: 20px;
            border: 1px solid #27272a;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            background: var(--bg-card);
        }
        #notice[data-kind="error"] {
            background: rgba(244, 63, 94, 0.1);
            border-color: rgba(244, 63, 94, 0.25);
            color: #fda4af;
        }
        #notice[data-kind="success"] {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
        }
        #notice[data-kind="warning"] {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.25);
            color: #fde68a;
        }

        .storage-warning {
            padding: 12px 16px;
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 10px;
            background: rgba(245, 158, 11, 0.1);
            color: #fde68a;
            font-size: 13px;
            margin-bottom: 16px;
        }

        dl {
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr);
            gap: 10px 14px;
            margin: 20px 0;
            font-size: 13px;
            padding: 16px;
            background: var(--bg-subtle);
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
        }
        dt {
            color: var(--text-dim);
            font-weight: 500;
        }
        dd {
            margin: 0;
            overflow-wrap: anywhere;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 12px;
        }

        pre {
            margin: 10px 0;
            padding: 14px;
            border: 1px solid #27272a;
            border-radius: 10px;
            background: #08090d;
            font: 12px/1.6 var(--font-mono);
            color: #cbd5e1;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        details {
            margin: 14px 0;
        }
        summary {
            cursor: pointer;
            color: #e4e4e7;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 0;
        }
        summary:hover {
            color: #ffffff;
        }

        .event {
            border-top: 1px solid var(--border-subtle);
            padding: 14px 0;
        }
        .event:first-of-type {
            border-top: none;
        }
        .event p {
            font-size: 13px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #f4f4f5;
        }
        .event small {
            font-size: 11px;
            color: var(--text-dim);
            font-family: var(--font-mono);
            display: block;
            margin-bottom: 4px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 760px) {
            body {
                padding: 20px 14px;
            }
            .layout {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 18px;
            }
            h1 {
                font-size: 20px;
            }
            #runs {
                max-height: 340px;
                overflow-y: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <a href="/" class="back-link">&#8592; Voltar ao painel principal</a>
            <h1>Diagnóstico de Execuções</h1>
            <p class="muted">Consulta os passos técnicos de cada execução e descarrega o relatório para análise.</p>
        </div>
    </header>

    <div id="notice" role="status" aria-live="polite" hidden></div>

    <section id="workspace" aria-label="Relatórios de diagnóstico">
        <div class="toolbar">
            <p id="retention" class="muted">Últimas 10 execuções</p>
            <div class="actions">
                <button id="refresh" type="button">Atualizar lista</button>
                <button id="export-all" class="primary" type="button">Descarregar lote (JSON)</button>
            </div>
        </div>
        <div class="layout">
            <section class="card" aria-label="Lista de execuções">
                <h2>Execuções Recentes</h2>
                <div id="runs"></div>
            </section>
            <section id="detail" class="card" aria-label="Detalhes da execução">
                <h2>Detalhes da Execução</h2>
                <p class="muted">Seleciona uma execução para consultar os eventos.</p>
            </section>
        </div>
    </section>
</main>
<script>
(() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const labels = { running: 'Em execução', completed: 'Concluída', error: 'Falhou', interrupted: 'Interrompida' };
    let session = 0;
    let selectedId = '';
    let detailRequest = 0;
    let refreshing = false;
    let exporting = false;
    const controllers = new Set();

    function element(tag, text, className) {
        const node = document.createElement(tag);
        if (text !== undefined && text !== null) node.textContent = String(text);
        if (className) node.className = className;
        return node;
    }

    function notice(message, kind = '') {
        $('notice').textContent = message;
        $('notice').dataset.kind = kind;
        $('notice').hidden = !message;
    }

    function formatDate(value) {
        if (!value) return '—';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('pt-PT');
    }

    function hashId() {
        try { return decodeURIComponent(location.hash.slice(1)); } catch (_) { return ''; }
    }

    function cancelRequests() {
        session += 1;
        controllers.forEach(controller => controller.abort());
        controllers.clear();
        detailRequest += 1;
        refreshing = false;
        exporting = false;
        $('refresh').disabled = false;
        $('export-all').disabled = false;
    }

    async function api(path) {
        const requestSession = session;
        const controller = new AbortController();
        controllers.add(controller);
        const timeout = setTimeout(() => controller.abort(), 20000);
        try {
            const response = await fetch(path, {
                headers: { Accept: 'application/json' },
                cache: 'no-store', signal: controller.signal, credentials: 'same-origin'
            });
            let data;
            try { data = await response.json(); } catch (_) {
                throw new Error(`O servidor devolveu uma resposta inválida (HTTP ${response.status}).`);
            }
            if (requestSession !== session) throw Object.assign(new Error(), { stale: true });
            if (!response.ok) {
                const fallback = response.status === 503
                    ? 'O histórico está temporariamente indisponível. Tenta novamente.'
                    : response.status === 404
                    ? 'Esta execução já não está disponível; pode ter saído das últimas 10 guardadas.'
                    : `Não foi possível obter o relatório (HTTP ${response.status}).`;
                throw new Error(data.message || fallback);
            }
            return data;
        } catch (error) {
            if (requestSession !== session || error.stale) throw Object.assign(new Error(), { stale: true });
            if (error.name === 'AbortError') throw new Error('O servidor demorou demasiado a responder. Tenta atualizar novamente.');
            if (error instanceof TypeError) throw new Error('Não foi possível ligar ao servidor. Verifica a ligação e tenta novamente.');
            throw error;
        } finally {
            clearTimeout(timeout);
            controllers.delete(controller);
        }
    }

    function renderList(runs) {
        $('runs').replaceChildren();
        if (!runs.length) {
            $('runs').append(element('p', 'Ainda não existem execuções registadas. Gera um trial para iniciar o histórico.', 'muted'));
            return;
        }
        for (const run of runs) {
            const button = element('button', null, 'run');
            button.type = 'button';
            button.dataset.runId = run.id;
            button.setAttribute('aria-pressed', String(run.id === selectedId));
            const top = element('span', null, 'run-top');
            const state = Object.prototype.hasOwnProperty.call(labels, run.status) ? run.status : '';
            top.append(element('span', labels[run.status] || run.status || 'Desconhecida', `badge ${state}`));
            top.append(element('small', formatDate(run.created_at)));
            button.append(top, element('small', `ID: ${run.id}`), element('small', run.error || run.message || 'Sem mensagem.'));
            button.addEventListener('click', () => {
                history.replaceState(null, '', `${location.pathname}#${encodeURIComponent(run.id)}`);
                loadDetail(run.id);
            });
            $('runs').append(button);
        }
    }

    function renderDetail(run) {
        const container = $('detail');
        container.replaceChildren(element('h2', 'Detalhes da Execução'));
        if (run.storage_warning) container.append(element('p', run.storage_warning, 'storage-warning'));
        const download = element('button', 'Descarregar esta execução (JSON)', 'primary');
        download.type = 'button';
        download.style.marginBottom = '16px';
        download.addEventListener('click', () => downloadReport(`/api/diagnostics/runs/${encodeURIComponent(run.id)}/export`, `diagnostico-${run.id}.json`, download));
        container.append(download);
        const summary = element('dl');
        const fields = [
            ['ID', run.id], ['Estado', labels[run.status] || run.status], ['Início', formatDate(run.created_at)],
            ['Fim', formatDate(run.finished_at)], ['Duração', run.duration_seconds == null ? '—' : `${run.duration_seconds} s`],
            ['Passo', run.step == null ? '—' : run.step], ['Tentativa', `${run.attempt || 0} / ${run.total_attempts || '—'}`],
            ['Mensagem', run.message || '—'], ['Erro', run.error || '—'], ['Tipo de erro', run.error_type || '—']
        ];
        for (const [name, value] of fields) summary.append(element('dt', name), element('dd', value));
        container.append(summary);
        if (run.metadata && Object.keys(run.metadata).length) {
            const metadata = element('details');
            metadata.append(element('summary', 'Contexto da execução'), element('pre', JSON.stringify(run.metadata, null, 2)));
            container.append(metadata);
        }
        const events = Array.isArray(run.events) ? run.events : [];
        container.append(element('h3', `Eventos Registados (${events.length})`));
        if (run.dropped_events) container.append(element('p', `${run.dropped_events} eventos mais antigos foram removidos por limite de tamanho.`, 'muted'));
        if (!events.length) container.append(element('p', 'Não existem eventos disponíveis para esta execução.', 'muted'));
        for (const event of events) {
            const row = element('article', null, 'event');
            row.append(element('small', [formatDate(event.timestamp), event.level, event.source, event.kind].filter(Boolean).join(' · ')));
            row.append(element('p', event.message || '(sem mensagem)'));
            if (event.details && Object.keys(event.details).length) row.append(element('pre', JSON.stringify(event.details, null, 2)));
            if (event.traceback) {
                const stack = element('details');
                stack.append(element('summary', 'Detalhe técnico do erro'), element('pre', event.traceback));
                row.append(stack);
            }
            container.append(row);
        }
    }

    async function loadDetail(id) {
        if (!id) return;
        selectedId = id;
        const request = ++detailRequest;
        $('runs').querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.runId === id)));
        $('detail').replaceChildren(element('h2', 'Detalhes da Execução'), element('p', 'A carregar eventos…', 'muted'));
        try {
            const data = await api(`/api/diagnostics/runs/${encodeURIComponent(id)}`);
            if (request !== detailRequest) return;
            renderDetail(data.run);
        } catch (error) {
            if (error.stale || request !== detailRequest) return;
            $('detail').replaceChildren(element('h2', 'Detalhes da Execução'), element('p', error.message));
        }
    }

    async function refresh() {
        if (refreshing) return;
        refreshing = true;
        const requestSession = session;
        $('refresh').disabled = true;
        notice('A carregar execuções…');
        try {
            const data = await api('/api/diagnostics/runs');
            $('workspace').hidden = false;
            const runs = Array.isArray(data.runs) ? data.runs : [];
            $('retention').textContent = `Últimas ${data.retention || 10} execuções · ${runs.length} disponíveis`;
            selectedId = hashId() || selectedId || (runs[0] && runs[0].id) || '';
            renderList(runs);
            notice(data.storage_warning || '', data.storage_warning ? 'warning' : '');
            if (selectedId) await loadDetail(selectedId);
            else $('detail').replaceChildren(element('h2', 'Detalhes da Execução'), element('p', 'O relatório ficará disponível depois da primeira execução.', 'muted'));
        } catch (error) {
            if (!error.stale) notice(error.message, 'error');
        } finally {
            if (requestSession === session) {
                refreshing = false;
                $('refresh').disabled = false;
            }
        }
    }

    async function downloadReport(path, filename, button) {
        if (exporting) return;
        exporting = true;
        const requestSession = session;
        button.disabled = true;
        notice('A preparar o relatório…');
        try {
            const data = await api(path);
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = element('a');
            link.href = url;
            link.download = filename;
            document.body.append(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            notice(`Relatório descarregado.${data.storage_warning ? ' ' + data.storage_warning : ''}`, data.storage_warning ? 'warning' : 'success');
        } catch (error) {
            if (!error.stale) notice(error.message, 'error');
        } finally {
            if (requestSession === session) { exporting = false; button.disabled = false; }
        }
    }

    $('refresh').addEventListener('click', refresh);
    $('export-all').addEventListener('click', () => downloadReport('/api/diagnostics/export', 'diagnostico-ultimas-10.json', $('export-all')));
    window.addEventListener('hashchange', () => loadDetail(hashId()));
    window.addEventListener('pagehide', cancelRequests);
    window.addEventListener('pageshow', event => { if (event.persisted) refresh(); });
    refresh();
})();
</script>
</body>
</html>
